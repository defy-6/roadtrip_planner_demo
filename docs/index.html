<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>行远 · 自驾行程</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./schedule.css"><link rel="stylesheet" href="./calendar.css"><link rel="stylesheet" href="./layout.css"></head>
<body><main>
  <header><div><p class="eyebrow">ROAD TRIP PLANNER</p><h1>行远</h1></div><div class="top-actions"><select id="planSelect" aria-label="行程计划"></select><button id="newPlanBtn" class="ghost" type="button">新建计划</button><button id="copyPlanBtn" class="ghost" type="button">复制计划</button><button id="deletePlanBtn" class="ghost danger" type="button">删除计划</button><span id="fileSaveStatus" class="hint">本地文件准备中</span><button id="placeLibraryBtn" class="ghost">地点库</button><button id="exportBtn" class="ghost">导出 JSON</button></div></header>
  <section class="hero"><div><input id="tripName" value="我的自驾行程" aria-label="行程名称"><p>每段路程独立确认，按天汇总后得到全程数据。</p></div><div class="route-stat"><span>已确认路程汇总</span><strong id="duration">—</strong><small id="distance">逐段查询路线后自动相加</small></div></section>
  <section class="schedule-panel"><div class="aside-head"><div><p class="eyebrow">DAILY AGENDA</p><h2>每日时间表</h2></div><div><button id="addScheduleBtn" type="button">+ 新增安排</button><button id="importFlightBtn" type="button" class="ghost">导入航班</button><select id="dayFilter" aria-label="按天筛选"><option value="">全部日期</option></select><span id="scheduleHint" class="hint">选择预设方案后查看</span></div></div><div id="schedule" class="schedule"></div></section>
  <section class="content"><article class="map-panel"><div id="map" class="map"><div class="map-empty"><span>路线预览</span><b>从左侧添加地点开始</b></div></div><div id="routeError" class="error"></div><button id="routeBtn" class="route-btn">查看分日路程汇总</button><div id="routeDetail" class="route-detail">选择一个景点定位；选择“路程”可查看并查询该段高德路线。</div></article>
  <aside><div class="aside-head"><h2>行程节点</h2><button id="addBtn">+ 添加</button></div><div id="items" class="items"></div><p class="hint">拖动排序后，重新计算路线即可更新。</p></aside></section>
</main><dialog id="eventEditor" class="event-editor"><form id="editorForm" class="editor-form" method="dialog"><h3>编辑时刻表事件</h3><div class="editor-grid"><label>日期<input id="editorDate" type="date"></label><label>类型<select id="editorType"><option value="spot">景点</option><option value="food">餐饮</option><option value="hotel">住宿</option><option value="service">服务区</option><option value="fuel">加油站</option><option value="supply">停车 / 补给</option></select></label><label>开始<input id="editorStart" type="time" step="300"></label><label>结束<input id="editorEnd" type="time" step="300"></label></div><label>活动 / 地点<input id="editorName"></label><label>地点地址（填写后可定位与计算路线）<input id="editorAddress"></label><label>说明<textarea id="editorNote" rows="3"></textarea></label><div class="editor-actions"><button type="button" id="editorCancel" class="ghost">取消</button><button type="submit">保存更新</button></div></form></dialog><dialog id="flightImporter" class="event-editor"><form id="flightImportForm" class="editor-form"><h3>人工导入航班</h3><div class="editor-grid"><label>出发日期<input id="flightDate" type="date" required></label><label>到达日期<input id="flightArrivalDate" type="date" required></label><label>航班号<input id="flightNumber" required placeholder="例如：CZ6825"></label><label>起飞机场<input id="flightDeparture" required placeholder="例如：广州白云机场"></label><label>降落机场<input id="flightArrival" required placeholder="例如：伊宁机场"></label><label>起飞时间<input id="flightDepartureTime" type="time" step="300" required></label><label>到达时间<input id="flightArrivalTime" type="time" step="300" required></label><label>出发航站楼<input id="flightDepartureTerminal" placeholder="例如：T2，可留空"></label><label>到达航站楼<input id="flightArrivalTerminal" placeholder="可留空"></label><label>经停机场<input id="flightStopoverAirport" placeholder="可选，例如：郑州新郑国际机场"></label><label>经停到达<input id="flightStopoverArrivalTime" type="time" step="300"></label><label>经停起飞<input id="flightStopoverDepartureTime" type="time" step="300"></label></div><label>备注<textarea id="flightNote" rows="3" placeholder="值机、行李额、订单号等非敏感备注"></textarea></label><p class="hint">经停航班可填写经停机场及停留时间；当前为人工录入，不会查询实时延误、登机口或航班动态。</p><div class="editor-actions"><button type="button" id="flightImportCancel" class="ghost">取消</button><button type="submit">确认导入</button></div></form></dialog><template id="itemTpl"><div class="item" draggable="true"><div class="drag">⠿</div><div class="item-main"><div class="tag-row"><select class="type"><option value="spot">景点</option><option value="food">餐饮</option><option value="hotel">住宿</option><option value="service">服务区</option><option value="fuel">加油站</option><option value="supply">停车 / 补给</option></select><input class="date" type="date"></div><div class="tag-row"><input class="start-time" type="time" step="300" aria-label="开始时间"><input class="end-time" type="time" step="300" aria-label="结束时间"></div><input class="name" placeholder="名称，如：西湖"><input class="address" placeholder="详细地址，用于高德定位"><textarea class="note" placeholder="备注 / 预约信息"></textarea><div class="photo-row"><label>添加照片<input class="photo" type="file" accept="image/*"></label><img class="preview" hidden></div></div><button class="delete" title="删除">×</button></div></template>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script src="https://unpkg.com/leaflet-image@0.4.0/leaflet-image.js"></script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" crossorigin="anonymous"></script><script src="./share-config.js"></script><script src="./plans.js"></script><script src="./app.js"></script></body></html>
