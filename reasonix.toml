arams).sort(([a],[b]) => a.localeCompare(b)));\n  return `${ep}?${new URLSearchParams(sorted)}`;\n}\n// 构造一个已有缓存（含旧查询条目）\nlet cache = {};\nconst put = (ep, params, val) => { cache[makeKey(ep, params)] = val; };\nput('/v3/place/text', { keywords: '赛里木湖东门', city: '博尔塔拉', citylimit: 'true' }, { old: 1 });\nput('/v3/geocode/geo', { address: '赛里木湖东门' }, { old: 2 });\nput('/v5/place/text', { keywords: '赛里木湖东门', page_size: '10' }, { old: 3 });\nput('/v5/direction/driving', { origin: 'A', destination: 'B', strategy: '0' }, { old: 4 });\nput('/v5/direction/driving', { origin: 'A', destination: 'B', strategy: '32' }, { old: 5 });\nput('/v5/direction/driving', { origin: 'A', destination: 'C', strategy: '32' }, { old: 6, keep: true });\nput('/v3/direction/walking', { origin: 'A', destination: 'B' }, { old: 7, keep: true });\nconsole.log('初始条目数:', Object.keys(cache).length);\n\n// 模拟一次新查询：同地址 geocode（走 v3/place/text 同点位）\nfunction prune(ep, params) {\n  const cacheKey = makeKey(ep, params);\n  const pointKey = cachePointKey(ep, params);\n  if (pointKey) {\n    for (const existing of Object.keys(cache)) {\n      if (existing === cacheKey) continue;\n      const [existingEndpoint, queryString] = existing.split('?');\n      const existingParams = Object.fromEntries(new URLSearchParams(queryString || ''));\n      if (cachePointKey(existingEndpoint, existingParams) === pointKey) delete cache[existing];\n    }\n  }\n  cache[cacheKey] = { new: true };\n}\nprune('/v3/place/text', { keywords: '赛里木湖东门', city: '博尔塔拉', citylimit: 'true' });\nconsole.log('geocode 同地址查询后条目数:', Object.keys(cache).length, '(期望 5：删掉 geo:赛里木湖东门 的 2 条 + 保留 3 条其他)');\nprune('/v5/place/text', { keywords: '赛里木湖东门', page_size: '10' });\nconsole.log('place-photos 同地址查询后条目数:', Object.keys(cache).length, '(期望 4：place 族旧条目被清)');\nprune('/v5/direction/driving', { origin: 'A', destination: 'B', strategy: '0' });\nconsole.log('route 同起终点查询后条目数:', Object.keys(cache).length, '(期望 3：strategy 0/32 两条同点位被清，walking 保留)');\nfor (const k of Object.keys(cache)) console.log('  保留:', k.split('?')[0], k.split('?')[1]);\nEOF", "Bash=cd /Users/defy/Desktop/fjplan/y2026/roadtrip-planner && node - <<'EOF'\n// 模拟 runtime.js 撤销栈核心流程（纯逻辑部分）\nlet undoStack = [], redoStack = [], lastCommittedState = null, restoringHistory = false;\nconst HISTORY_LIMIT = 20;\nlet state = { n: 0 }; // 模拟内容状态\nfunction fileSavePayload() { return { activeVersion: 'v1', plans: [{id:'v1',name:'x'}], versions: { v1: { n: state.n } }, locations: [], routes: [], sharedSchedule: {}, updatedAt: new Date().toISOString(), baseUpdatedAt: 'b' }; }\nfunction historySignature(p) { const { updatedAt, baseUpdatedAt, sharedSchedule, ...rest } = p; return JSON.stringify(rest); }\nfunction commitHistory() {\n  if (restoringHistory) return;\n  const payload = fileSavePayload();\n  const sig = historySignature(payload);\n  if (lastCommittedState === null) { lastCommittedState = payload; return; }\n  if (historySignature(lastCommittedState) === sig) { lastCommittedState = payload; return; }\n  undoStack.push(JSON.stringify(lastCommittedState));\n  if (undoStack.length > HISTORY_LIMIT) undoStack.shift();\n  redoStack.length = 0;\n  lastCommittedState = payload;\n}\nfunction undoPlannerChange() {\n  const prev = undoStack.pop(); if (!prev) return;\n  redoStack.push(JSON.stringify(fileSavePayload()));\n  restorePlannerState(prev);\n}\nfunction redoPlannerChange() {\n  const next = redoStack.pop(); if (!next) return;\n  undoStack.push(JSON.stringify(fileSavePayload()));\n  restorePlannerState(next);\n}\nlet loadCalls = [];\nfunction restorePlannerState(raw) {\n  const data = JSON.parse(raw);\n  restoringHistory = true;\n  try {\n    loadCalls.push(data.versions.v1.n);\n    state.n = data.versions.v1.n;\n    lastCommittedState = fileSavePayload();\n  } finally { restoringHistory = false; }\n}\n\n// 1. 启动加载（save 1 次，不入栈）\nstate.n = 0; commitHistory();\nconsole.log('启动后: undo=', undoStack.length, '(期望 0), lastCommitted.n=', lastCommittedState.versions.v1.n);\n// 2. 编辑 → n=1\nstate.n = 1; commitHistory();\nconsole.log('编辑1后: undo=', undoStack.length, '(期望 1), 栈顶.n=', JSON.parse(undoStack[0]).versions.v1.n, '(期望 0)');\n// 3. 连续两次编辑但内容回到同一状态（如改 A 又改回 A）\nstate.n = 2; commitHistory();\nstate.n = 0; commitHistory(); // 改回\nconsole.log('改回后: undo=', undoStack.length, '(期望 2)');\n// 4. undo ×2 回到 n=0 前 → n=0\nundoPlannerChange();\nconsole.log('undo1: n=', state.n, '(期望 0), redo=', redoStack.length, '(期望 1), undo=', undoStack.length, '(期望 1)');\nundoPlannerChange();\nconsole.log('undo2: n=', state.n, '(期望 0), undo=', undoStack.length, '(期望 0), redo=', redoStack.length, '(期望 2)');\n// 5. redo\nredoPlannerChange();\nconsole.log('redo1: n=', state.n, '(期望 0), undo=', undoStack.length, '(期望 1), redo=', redoStack.length, '(期望 1)');\n// 6. redo 到底\nredoPlannerChange(); redoPlannerChange();\nconsole.log('redo3: n=', state.n, '(期望 2), redo=', redoStack.length, '(期望 0)');\n// 7. undo 后新编辑清空 redo\nundoPlannerChange(); state.n = 99; commitHistory();\nconsole.log('undo+新编辑: redo=', redoStack.length, '(期望 0), undo=', undoStack.length, '(期望 2)');\n// 8. 恢复过程不产生新撤销记录\nstate.n = 100; commitHistory(); // 模拟恢复前 save\nconst before = undoStack.length; undoPlannerChange();\nconsole.log('恢复后 undo 不变:', undoStack.length === before, '(期望 true)');\nconsole.log('load 调用序列:', loadCalls.join(','), '(期望 0,0,0,2,0,2,0)');\nEOF", "Bash=cd /Users/defy/Desktop/fjplan/y2026/roadtrip-planner && PORT=3999 node server.js > /tmp/rt-server.log 2>&1 &\nSERVER_PID=$!\nsleep 1.2\necho \"=== 服务器日志 ===\" && cat /tmp/rt-server.log\necho \"=== /api/preview-mode ===\" && curl -s http://localhost:3999/api/preview-mode\necho \"\"\necho \"=== /api/planner-data 前 200 字符 ===\" && curl -s http://localhost:3999/api/planner-data | head -c 200\necho \"\"\necho \"=== 静态 index.html 含 undoBtn ===\" && curl -s http://localhost:3999/ | grep -o 'id=\"undoBtn\"' | head -1\nkill $SERVER_PID 2>/dev/null\necho \"=== 已停止 ===\"", "Bash=cd /Users/defy/Desktop/fjplan/y2026/roadtrip-planner &